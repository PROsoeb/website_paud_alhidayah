backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pengumuman"
    label: "Pengumuman Sekolah"
    file: "data.json"
    fields:
      - {label: "Judul Pengumuman", name: "judul", widget: "string"}
      - {label: "Isi Pengumuman", name: "isi", widget: "text"}